<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEREOS — Markets</title><link rel="stylesheet" href="style.css"></head><body><script src="script.js"></script><script>document.write(shell('markets'))</script><div class="container"><div class="hero"><div><div class="eyebrow">MARKETS / LIVE FEED</div><h1>Explore markets.</h1><p>Green/red candles, live simulation and exact trade markers.</p></div></div><div class="panel"><input id="search" placeholder="⌕ Search BTC, ETH, PEPE..." style="width:100%;padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:inherit"><div class="asset-grid" id="assets"></div></div></div>${closeShell()}<script>wireCommon();function render(){let q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('assets').innerHTML=Object.entries(ASSETS).filter(([s,a])=>(s+a.name).toLowerCase().includes(q)).map(([s,a])=>{let mini=a.change>=0?'M10 60 Q 45 5 80 45 T 160 25 T 240 50':'M10 20 Q 45 80 80 35 T 160 70 T 240 45';return `<div class="card asset"><div class="asset-head">${assetIcon(s)}<div><h3>${a.name}</h3><span class="muted">${s} · ${a.kind}</span></div><b class="${a.change>=0?'up':'down'}">${a.change>=0?'+':''}${a.change}%</b></div><div class="price live-price">${money(a.price)}</div><div class="mini-chart"><svg viewBox="0 0 250 80" preserveAspectRatio="none"><path d="${mini}" fill="none" stroke="${a.change>=0?'#39ff88':'#ff4d67'}" stroke-width="3"/></svg></div><div class="trade-row"><button class="buy" onclick="openTrade('${s}')">BUY</button><button class="sell" onclick="openTrade('${s}')">SELL</button></div></div>`}).join('')}render();document.getElementById('search').oninput=render;startLive('BTC',[]);</script></body></html>
