<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kereos — Markets</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">KEREOS<small>TRADING TERMINAL</small></div><nav class="nav"><a href="index.html">⌂ <span>Dashboard</span></a><a href="markets.html">◈ <span>Markets</span></a><a href="portfolio.html">◉ <span>Portfolio</span></a><a href="challenges.html">♜ <span>Challenges</span></a></nav></aside><main class="main"><div class="topbar"><span class="pill demo">● DEMO</span><span class="pill" data-cash>$10,000</span><div class="avatar">K</div></div><div class="eyebrow">Markets</div><h1 class="title">Explore markets.</h1><p class="subtitle">Live prices, 24h changes and volume. Orders are simulated.</p><input id="search" class="search" placeholder="⌕  Search Bitcoin, BTC, PEPE, Solana..."><div class="tabs"><button class="tab active" data-tab="all">All assets</button><button class="tab" data-tab="major">◆ Major crypto</button><button class="tab" data-tab="meme">🔥 Meme coins</button></div><div id="coinGrid" class="grid coins"></div></main></div><div id="modal" class="modal-bg"><div class="modal"><div class="modal-head"><div class="asset"><div class="coin btc">₿</div><div><b>Trade <span id="tradeName">Bitcoin</span></b><div class="muted" id="tradeSymbol">BTC</div></div></div><button class="close" onclick="closeTrade()">×</button></div><div class="trade-tabs"><button id="buyTab" class="active buy" onclick="setSide('buy')">Buy</button><button id="sellTab" class="sell" onclick="setSide('sell')">Sell</button></div><div class="field"><label>CURRENT PRICE</label><b id="tradePrice" style="font-size:22px">$0</b></div><div class="field"><label>AMOUNT (USD)</label><input id="amount" type="number" min="1" value="100"></div><div class="estimate"><div><span>Quantity</span><b id="qty">0</b></div><div><span>Demo fee (0.1%)</span><b id="fee">$0.10</b></
