<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markets — Kereos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <span class="brand-icon">K</span>
    <span>KEREOS</span>
  </a>

  <nav>
    <a href="index.html">Terminal</a>
    <a href="markets.html" class="active">Markets</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="challenges.html">Challenges</a>
  </nav>

  <div class="demo-balance">
    <small>DEMO BALANCE</small>
    <strong id="navBalance">$10,000.00</strong>
  </div>
</header>


<main class="container page">

  <section class="page-heading">
    <div>
      <small>MARKET EXPLORER</small>
      <h1>Markets</h1>
      <p>Simulated prices update automatically.</p>
    </div>

    <div class="live-status">
      <span></span>
      LIVE SIMULATION
    </div>
  </section>


  <section class="market-tools">

    <input
      id="search"
      type="search"
      placeholder="Search meme coins..."
    >

    <div>
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="gainers">Gainers</button>
      <button class="filter" data-filter="losers">Losers</button>
    </div>

  </section>


  <section id="marketList" class="market-list"></section>

</main>


<script src="app.js"></script>

</body>
</html>
