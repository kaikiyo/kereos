```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kereos — Markets</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-mark">K</div>
            <div>
                <h2>Kereos</h2>
                <span>Demo Trading</span>
            </div>
        </div>

        <nav>
            <a href="index.html">⌂ <span>Dashboard</span></a>
            <a class="active" href="markets.html">◈ <span>Markets</span></a>
            <a href="portfolio.html">◉ <span>Portfolio</span></a>
            <a href="challenges.html">🏆 <span>Challenges</span></a>
        </nav>

        <div class="sidebar-bottom">
            <button class="sidebar-btn" onclick="openAddFunds()">＋ Add Demo Funds</button>
        </div>

    </aside>


    <main class="main">

        <header class="topbar">
            <div>
                <p class="eyebrow">MARKETS</p>
                <h1>Explore markets.</h1>
            </div>

            <span class="demo-pill">● DEMO MODE</span>
        </header>


        <div class="market-tabs">
            <button class="market-tab active">All</button>
            <button class="market-tab">Crypto</button>
            <button class="market-tab">🔥 Meme</button>
        </div>


        <section class="trading-layout">

            <div class="market-list">

                <div class="search-box">
                    🔍
                    <input id="marketSearch" placeholder="Search assets..." oninput="renderMarketsPage()">
                </div>

                <div id="fullMarketList"></div>

            </div>


            <div class="trading-panel">

                <div class="trading-header">

                    <div>
                        <span class="coin-symbol" id="tradeSymbol">BTC / USD</span>
                        <h2 id="tradePrice">$108,500.00</h2>
                        <span class="positive" id="tradeChange">+2.84%</span>
                    </div>

                    <span class="live-pill">● LIVE</span>

                </div>


                <div class="chart-container">

                    <div class="chart-toolbar">
                        <button class="chart-time active">1H</button>
                        <button class="chart-time">4H</button>
                        <button class="chart-time">1D</button>
                        <button class="chart-time">1W</button>
                    </div>

                    <canvas id="priceChart"></canvas>

                </div>


                <div class="order-markers" id="orderMarkers">
                    <span>BUY/SELL markers appear here after you trade.</span>
                </div>


                <div class="trade-box">

                    <div class="trade-toggle">
                        <button id="buyTab" class="selected" onclick="setTradeSide('buy')">
                            Buy
                        </button>

                        <button id="sellTab" onclick="setTradeSide('sell')">
                            Sell
                        </button>
                    </div>

                    <label>Asset amount</label>

                    <input id="tradeAmount" type="number" min="0" step="any" placeholder="0.00">

                    <div class="trade-summary">
                        <span>Estimated value</span>
                        <strong id="estimatedValue">$0.00</strong>
                    </div>

                    <button id="executeTrade" class="primary-btn full" onclick="executeCurrentTrade()">
                        Buy BTC
                    </button>

                </div>

            </div>

        </section>


        <section class="section" id="meme">

            <div class="section-header">
                <div>
                    <p class="eyebrow">MEME ZONE</p>
                    <h2>Chaos market 🐸</h2>
                </div>
            </div>

            <div class="coin-grid" id="memeGrid"></div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
```
