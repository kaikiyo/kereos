<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEREOS — Orders</title><link rel="stylesheet" href="style.css"></head><body><script src="script.js"></script><script>document.write(shell('orders'))</script><div class="container"><div class="eyebrow">ORDERS / EXECUTION LOG</div><div class="hero"><div><h1>Order flow.</h1><p>Every executed demo trade is recorded here.</p></div></div><div class="panel"><table class="table"><thead><tr><th>ID</th><th>Time</th><th>Asset</th><th>Side</th><th>Quantity</th><th>Price</th></tr></thead><tbody>${state.orders.length?state.orders.map(o=>`<tr><td>${o.id}</td><td>${o.time}</td><td>${assetIcon(o.sym)} ${o.sym}</td><td><span class="badge ${o.side.toLowerCase()}">${o.side}</span></td><td>${o.qty.toFixed(6)}</td><td>${money(o.price)}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No executed orders yet.</div></td></tr>`}</tbody></table></div></div>${closeShell()}<script>wireCommon();</script></body></html>
