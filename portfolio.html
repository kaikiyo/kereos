<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEREOS — Portfolio</title><link rel="stylesheet" href="style.css"></head><body><script src="script.js"></script><script>document.write(shell('portfolio'))</script><div class="container"><div class="hero"><div><div class="eyebrow">PORTFOLIO / CONTROL CENTER</div><h1>Your positions.</h1><p>Every fill updates quantity, average price, cash and P&amp;L.</p></div><button class="btn" onclick="localStorage.removeItem('kereosV12');location.reload()">Reset demo</button></div><div class="cards"><div class="card metric"><small>Total value</small><strong id="tv"></strong></div><div class="card metric"><small>Cash</small><strong id="ca"></strong></div><div class="card metric"><small>Invested</small><strong id="iv"></strong></div><div class="card metric"><small>P&amp;L</small><strong id="pl"></strong></div></div><div class="section-grid"><div class="panel"><h3>Holdings</h3><p class="muted">Live mark-to-market positions</p><div id="holdings"></div></div><div class="panel"><h3>Allocation</h3><div id="allocation" class="list"></div></div></div><div class="panel" style="margin-top:16px"><h3>Performance</h3>${chartHTML('BTC',330)}</div></div>${closeShell()}<script>wireCommon();function render(){document.getElementById('tv').textContent=money(state.cash+totalPositions());document.getElementById('ca').textContent=money(state.cash);document.getElementById('iv').textContent=money(Object.entries(state.positions).reduce((s,[k,p])=>s+p.avg*p.qty,0));document.getElementById('pl').textContent=(pnl()>=0?'+':'')+money(pnl());let hs=Object.entries(state.positions);document.getElementById('holdings').innerHTML=hs.length?`<table class="table"><thead><tr><th>Asset</th><th>Qty</th><th>Avg</th><th>Mark</th><th>P&L</th><th></th></tr></thead><tbody>${hs.map(([s,p])=>{let u=(ASSETS[s].price-p.avg)*p.qty;return `<tr><td>${assetIcon(s)} ${s}</td><td>${p.qty.toFixed(6)}</td><td>${money(p.avg)}</td><td>${money(ASSETS[s].price)}</td><td class="${u>=0?'up':'down'}">${u>=0?'+':''}${money(u)}</td><td><button class="sell" onclick="openTrade('${s}')">Sell</button></td></tr>`}).join('')}</tbody></table>`:`<div class="empty">No positions yet.<br>Go to Markets and make a demo trade.</div>`;document.getElementById('allocation').innerHTML=hs.length?hs.map(([s,p])=>`<div class="list-item">${assetIcon(s)}<div><b>${ASSETS[s].name}</b><div class="muted">${money(p.qty*ASSETS[s].price)}</div></div><b>${((p.qty*ASSETS[s].price)/(totalPositions()||1)*100).toFixed(1)}%</b></div>`).join(''):`<div class="empty">Portfolio is all cash.</div>`}render();startLive('BTC',[]);</script></body></html>
