<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEREOS — Watchlist</title><link rel="stylesheet" href="style.css"></head><body><script src="script.js"></script><script>document.write(shell('watchlist'))</script><div class="container"><div class="eyebrow">WATCHLIST / SIGNALS</div><div class="hero"><div><h1>Keep an eye.</h1><p>Your selected markets, always one tap from a trade.</p></div><button class="primary" onclick="location.href='markets.html'">＋ Add market</button></div><div class="list" id="wl"></div></div>${closeShell()}<script>wireCommon();document.getElementById('wl').innerHTML=state.watchlist.map(s=>{let a=ASSETS[s];return `<div class="list-item">${assetIcon(s)}<div><b>${a.name}</b><div class="muted">${s} · ${a.kind}</div></div><strong>${money(a.price)}</strong><span class="${a.change>=0?'up':'down'}">${a.change>=0?'+':''}${a.change}%</span><button class="btn" onclick="openTrade('${s}')">Trade</button></div>`}).join('');startLive('BTC',[]);</script></body></html>
